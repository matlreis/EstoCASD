{% extends 'base.html' %}
{% load static %}

{% block title %}Dashboard | EstoCASD{% endblock %}

{% block content %}
    <h1>Dashboard Zeladoria</h1>

    <div class="container-grafico">
        <canvas id="graficoVendas"></canvas>
    </div>

    <h1>Dashboard Atrasos</h1>

    <div class="container-grafico">
        <canvas id="graficoAtrasos"></canvas>
    </div>

    <script src="{% static 'js/chart.umd.min.js' %}"></script>
    {% block scripts %}
        <script>
            const itens_vendidos = {{ itens_vendidos_json|safe }};
            const valores = {{ valores_totais_json|safe }};

            const ctx = document.getElementById('graficoVendas').getContext('2d');
            
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: itens_vendidos,
                    datasets: [{
                        label: 'Quantidade Vendida',
                        data: valores,
                        backgroundColor: 'rgba(54, 162, 235, 0.7)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1 
                            }
                        }
                    }
                }
            });
        </script>
        <script>
            const itens_atrasados = {{ itens_atrasados_json|safe }};
            const atrasos = {{ atrasos_totais_json|safe }};

            const cty = document.getElementById('graficoAtrasos').getContext('2d');
            
            new Chart(cty, {
                type: 'bar',
                data: {
                    labels: itens_atrasados,
                    datasets: [{
                        label: 'Itens mais atrasados',
                        data: atrasos,
                        backgroundColor: 'rgba(54, 162, 235, 0.7)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1 
                            }
                        }
                    }
                }
            });
        </script>
    {% endblock %}
{% endblock %}
