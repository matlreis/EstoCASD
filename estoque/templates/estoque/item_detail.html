{% extends 'base.html' %}

{% block title %}{{ item.nome }} | EstoCASD{% endblock %}

{% block content %}
    <h1>{{ item.nome }}</h1>
    <p>Disponível: {{ item.quant_disponivel }} de {{ item.quant_total }}</p>

    <div class="acoes">
        <a class="btn btn-primario" href="{% url 'estoque:emprestimo_create' item.pk %}">Emprestar</a>
        <a class="btn" href="{% url 'estoque:devolucao_sinalizar' item.pk %}">Devolver</a>
    </div>
{% endblock %}
