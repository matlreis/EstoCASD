{% extends 'base.html' %}

{% block title %}Login | Estoque CASD{% endblock %}

{% block content %}
    <div class="titulo-pagina">
        <h1>Acesso ao Sistema</h1>
    </div>

    <div>
        <h2>Fazer Login</h2>

        <div class="formulario">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                
                <button type="submit" class="btn btn-primario">Entrar</button>
            </form>
        </div>
        
        <div class="conteudo">
                <p>Ainda não tem uma conta?</p>
                <a href="{% url 'autenticacao:cadastro' %}">
                    <button type="button" class="btn btn-primario">Ir para o Cadastro</button>
                </a>
            </div>
    </div>
{% endblock %}
