{% extends 'base.html' %}

{% block title %}Login | EstoCASD{% endblock %}

{% block content %}
    <div class="titulo-pagina">
        <h1>Acesso ao Sistema</h1>
    </div>

    <div>
        <h2>Fazer Login</h2>

        <div class="formulario">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                
                <button type="submit" class="btn btn-primario">Entrar</button>
            </form>
        </div>
    </div>
{% endblock %}
